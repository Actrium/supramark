name: Official Diagram Visual Regression

on:
  workflow_dispatch:
    inputs:
      case_ids:
        description: "Comma separated case IDs, or all"
        required: false
        default: "all"
      source_docs:
        description: "Semicolon separated case markdown files, relative to tests/official-diagram-visual"
        required: false
        default: "cases/official-diagram-rendering-cases.md"
      supramark_url:
        description: "Supramark playground URL"
        required: false
        default: "https://actrium.github.io/supramark/playground/"
      issue_repo:
        description: "Repository to receive generated issues"
        required: false
        default: "Actrium/supramark"
      submit_github_issues:
        description: "Create GitHub issues for failed cases: 1 or 0"
        required: false
        default: "0"
      submit_review_issues:
        description: "Also create GitHub issues for review cases when submit_github_issues is 1: 1 or 0"
        required: false
        default: "0"
      playwright_headless:
        description: "Run browser in headless mode: 1 or 0"
        required: false
        default: "1"
      playwright_viewport:
        description: "Browser viewport, for example 1280x900"
        required: false
        default: "1920x1080"
permissions:
  contents: read
  issues: write

jobs:
  compare-official-diagrams:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: tests/official-diagram-visual
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: tests/official-diagram-visual
        run: npx playwright install --with-deps chromium

      - name: Run official diagram visual comparison
        working-directory: tests/official-diagram-visual
        env:
          CASE_IDS: ${{ github.event.inputs.case_ids || 'all' }}
          SOURCE_DOCS: ${{ github.event.inputs.source_docs || 'cases/official-diagram-rendering-cases.md' }}
          SUPRAMARK_URL: ${{ github.event.inputs.supramark_url || 'https://actrium.github.io/supramark/playground/' }}
          SUBMIT_GITHUB_ISSUES: ${{ github.event.inputs.submit_github_issues || '0' }}
          SUBMIT_REVIEW_ISSUES: ${{ github.event.inputs.submit_review_issues || '0' }}
          FAIL_ON_FAILURES: "1"
          GH_TOKEN: ${{ secrets.GH_ISSUES_TOKEN || github.token }}
          ISSUE_REPO: ${{ github.event.inputs.issue_repo || 'Actrium/supramark' }}
          ISSUE_LABELS: "bug,automated-visual-regression"
          PLAYWRIGHT_HEADLESS: ${{ github.event.inputs.playwright_headless || '1' }}
          PLAYWRIGHT_VIEWPORT: ${{ github.event.inputs.playwright_viewport || '1920x1080' }}
          PLAYWRIGHT_DEVICE_SCALE_FACTOR: "1"
          SUPRAMARK_PREVIEW_WIDTH: "540"
          REPO_PATH_PREFIX: "tests/official-diagram-visual"
        run: |
          if [ "$PLAYWRIGHT_HEADLESS" = "0" ]; then
            xvfb-run -a npm run visual:official-diagrams
          else
            npm run visual:official-diagrams
          fi

      - name: Upload visual regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-diagram-visual-workflow
          path: tests/official-diagram-visual/artifacts/official-diagram-visual-workflow/

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# KNOWN GAP -- needs a repository setting, not a change in this file.
#
# On `pull_request`, actions/checkout already builds the PR merged into its
# base (refs/pull/N/merge), so every job below runs against the merge result
# rather than the PR head. What is missing is a re-run when the base moves:
# a green check stays green after main advances underneath it, and nothing
# re-evaluates it before merge.
#
# #105 is the worked example. It was cut on 2026-07-24 and went green. #92
# then landed on main and narrowed `highlighted` to ReadonlyMap across the
# RN render chain. #105's own helper still declared a mutable Map, so the
# two together did not type-check -- while #105 sat green, because its
# checks were computed against the pre-#92 main and never recomputed. The
# break only surfaced when the branch was explicitly updated.
#
# The fix is the "Require branches to be up to date before merging" toggle
# on the `main` ruleset (`strict_required_status_checks_policy: true`),
# which forces a re-run against current main before the merge button
# unlocks. That is admin-only -- write access cannot set it. Until an admin
# turns it on, treat a long-lived green PR as unverified and update its
# branch before merging.

jobs:
  # License compliance — REUSE spec + cargo-deny over the Rust workspace.
  # The workspace-internal SPDX field check runs in the test job
  # (`bun run license:check`); this job covers REUSE-spec headers and
  # the Rust dependency graph.
  license:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false  # Graphviz upstream is intentionally not pulled

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install reuse
        run: pipx install reuse

      - name: REUSE lint
        run: reuse lint
        continue-on-error: true  # warn-only until per-file SPDX headers land

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo-deny check
        run: cargo deny check

  # Fast (syntactic) ESLint over the whole repo plus the feature linter.
  # The type-aware pass runs in the test job after the build.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --no-progress

      - name: ESLint + feature linter
        run: bun run lint

      # Deliberately its own step rather than only riding inside `bun run lint`,
      # so a language violation is named in the check list instead of being
      # reported as a generic lint failure. It also still runs when eslint is
      # what failed, which `&&` in the lint script would prevent.
      #
      # This lives in the Lint job on purpose: Lint is one of the required
      # status checks on main, so the gate blocks a merge without needing the
      # branch ruleset to be edited.
      - name: English-only source (no CJK)
        if: always()
        run: node scripts/check-cjk.mjs

  # Code quality checks and tests
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --no-progress

      - name: License compliance (workspace SPDX)
        run: bun run license:check

      - name: Setup Rust toolchain (for wasm builds)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Run supramark-markdown tests (lib + integration)
        # Unit tests for the canonical parser's AST v2 mapping (autolink → Link,
        # HTML block type-6 paragraph interruption, fence info unescaping,
        # punctuation classification), plus tests/public_api.rs — the contract
        # suite for what `parse()` hands the renderers.
        #
        # This used to be `--lib`, which left tests/public_api.rs running in
        # exactly one place: the `cargo test -p supramark-markdown --test
        # public_api` step of commonmark-conformance.yml, a workflow with no
        # `pull_request` trigger. #121 changed HTML-block line-terminator
        # semantics without updating two assertions there, so main merged red
        # and stayed red for three pushes — and because that step runs before
        # the CLI build and the conformance comparison, those were skipped on
        # every run, so the CommonMark comparison never actually executed.
        # Dropping `--lib` puts the contract suite on the PR-gating path where
        # a break is caught before merge.
        if: matrix.node-version == '20.x'
        run: cargo test -p supramark-markdown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Build in-tree wasm packages
        run: bun run build:wasm

      - name: Run core tests (coverage)
        run: bun run test:core -- --coverage

      # The `example-*` filter pulls in examples/react-web-csr, whose
      # playground-routes.test.ts guards the route table the web preview builds
      # its URLs from. Nothing else in CI ran that package's tests, so those
      # assertions were local-only feedback. `--if-present` skips example
      # packages that declare no test script.
      - name: Run workspace tests (features / renderers / engines / examples)
        run: bun run --filter '@supramark/feature-*' --filter '@supramark/rn' --filter '@supramark/engines' --filter '@supramark/example-*' --if-present test

      - name: Upload coverage to Codecov
        if: matrix.node-version == '20.x'
        uses: codecov/codecov-action@v4
        with:
          files: ./packages/core/coverage/coverage-final.json
          flags: core
          name: core-coverage
          fail_ci_if_error: false

      - name: React Native package tests (native-module resolution)
        run: |
          for pkg in graphviz-anywhere d2-little mermaid-little plantuml-little; do
            echo "::group::$pkg resolve-native"
            (cd "crates/$pkg/packages/react-native" && bun test)
            echo "::endgroup::"
          done

      - name: Build packages
        run: bun run build

      - name: Type-aware lint
        # Runs after the build so the per-package type checker resolves the
        # same project graph as the build. Single matrix entry is enough.
        if: matrix.node-version == '20.x'
        run: bun run lint:types

      - name: Quality check
        if: matrix.node-version == '20.x'
        run: bun run quality

      # Build the CSR preview bundle and assert no diagram dynamic-import
      # specifier leaked as a bare module specifier — the runtime form of
      # upstream issues #80 / #79 (browser throws "Failed to resolve module
      # specifier" on the deployed static site). The source-level guard lives
      # in the engines contract test; this is the build-artifact check.
      - name: Build CSR preview & verify diagram specifiers
        if: matrix.node-version == '20.x'
        run: |
          cd examples/react-web-csr && bun run build
          cd ../.. && bun run check:diagram-specifiers

  # Host-side native bridge tests (JNI string/handle marshalling) — run on a
  # host JVM with no Android NDK, emulator or gradle. Only d2 and mermaid run
  # here: their cargo crates are self-contained. graphviz-anywhere and plantuml
  # are excluded — graphviz's host static lib must be built from Graphviz source
  # (slow), and plantuml-native transitively depends on the graphviz-anywhere
  # crate (PlantUML embeds dot), whose build.rs needs a prebuilt graphviz lib
  # not present on a clean CI runner. Their JNI host tests and the iOS XCTest
  # stubs (which need a macOS runner) run out-of-band via the scripts under
  # packages/react-native.
  native-host-tests:
    name: Native host tests (JNI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run JNI host bridge tests
        run: |
          for pkg in d2-little mermaid-little; do
            echo "::group::$pkg JNI host test"
            crates/$pkg/packages/react-native/scripts/test-android-jni.sh
            echo "::endgroup::"
          done

  # Exercise the exact crates.io fallback used by downstream `cargo install`
  # consumers. A library-only `cargo build` cannot detect a missing rpath or a
  # loader selecting an ABI-incompatible same-named shared library, so this job
  # builds and runs a final executable with a real DOT -> SVG render.
  graphviz-release-runtime-smoke:
    name: Graphviz release runtime (${{ matrix.os }})
    env:
      # PRs for the next crate version run before that tag exists. Use the
      # latest published assets while exercising the current build script.
      GRAPHVIZ_ANYWHERE_ALLOW_DOWNLOAD: "1"
      GRAPHVIZ_ANYWHERE_RELEASE_VERSION: "0.2.3"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux static-link dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libexpat1-dev zlib1g-dev

      - name: Test target and ABI mappings
        shell: bash
        run: cargo test -p graphviz-anywhere --test build_helpers_tests

      - name: Build final executable from release asset
        shell: bash
        run: cargo build --release -p graphviz-anywhere-example

      - name: Run DOT-to-SVG smoke without loader overrides
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            target/release/graphviz-anywhere-example.exe > graphviz-smoke.log
          else
            env -u LD_LIBRARY_PATH -u DYLD_LIBRARY_PATH \
              target/release/graphviz-anywhere-example > graphviz-smoke.log
          fi
          grep -q "SVG output" graphviz-smoke.log

      - name: Assert no Graphviz desktop runtime dependency
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            ! otool -L target/release/graphviz-anywhere-example | grep -q libgraphviz_api
          else
            ! ldd target/release/graphviz-anywhere-example | grep -q libgraphviz_api
          fi

  # plantuml-little's Rust tests (parser / layout / render unit tests) do not
  # run in the "Test & Build" job — that job only exercises the RN JS wrappers,
  # and `cargo test -p plantuml-little` needs the graphviz-anywhere native lib,
  # which isn't on a clean runner. Build that lib once (cached), then run the
  # library unit tests. `--lib` skips the byte-exact reference suite, which
  # additionally needs a local Java PlantUML jar; that heavier suite can be a
  # follow-up job. See the CI-coverage tracking issue.
  plantuml-rust-tests:
    name: plantuml-little Rust tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Graphviz build tools
        run: sudo apt-get update && sudo apt-get install -y cmake bison flex pkg-config

      - name: Graphviz submodule revision
        id: gv
        run: echo "sha=$(git rev-parse HEAD:crates/graphviz-anywhere/graphviz)" >> "$GITHUB_OUTPUT"

      - name: Cache Graphviz native lib
        id: gv-cache
        uses: actions/cache@v4
        with:
          path: crates/graphviz-anywhere/output
          key: graphviz-api-linux-x86_64-${{ steps.gv.outputs.sha }}-${{ hashFiles('crates/graphviz-anywhere/scripts/**') }}

      - name: Build Graphviz native lib
        if: steps.gv-cache.outputs.cache-hit != 'true'
        run: (cd crates/graphviz-anywhere && ./scripts/build-linux.sh)

      - name: cargo test -p plantuml-little (lib unit tests)
        run: cargo test -p plantuml-little --lib

  # d2-little's Rust unit tests (text-measurement / Go-emulation ruler /
  # layout) had no CI job — the "Test & Build" job only exercises the RN
  # JS wrapper and the wasm build, never `cargo test -p d2-little`. That
  # left both the native d2_go_emulation unit tests and any host-path
  # helpers (e.g. `host_label_height::single_line_height`) without
  # regression coverage. d2-little is self-contained (no graphviz /
  # fonttools native deps), so a plain `cargo test --lib` is enough; the
  # heavier byte-exact e2e / cross-validation suites can be a follow-up.
  d2-rust-tests:
    name: d2-little Rust tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo test -p d2-little (lib unit tests)
        run: cargo test -p d2-little --lib

  # mermaid-little had no CI job at all (#123). The "Test & Build" job only
  # builds the wasm bundle via `bun run build:wasm`, which compiles
  # mermaid-little-web for wasm32 but never compiles or runs the crate's own
  # tests — so a change that breaks `cargo test -p mermaid-little`, or breaks
  # the crate's native build entirely, lands with every check green. The
  # decluster work in #122 / #128 touches layout code whose only regression
  # coverage lives in these suites.
  #
  # Unlike plantuml-little (graphviz native lib) and d2-little (heavy e2e),
  # mermaid-little needs no native deps and no submodules, and the default
  # feature set (`cli`, `metrics-ttf-parser`) is what the byte-exact suites
  # want, so the full `cargo test -p mermaid-little` runs here rather than
  # just `--lib`. The `katex` / `cose_bilkent` features stay off — they
  # vendor QuickJS and are a separate, much slower tier.
  #
  # Runtime is ~3.5 min of test execution on top of the build (the lib suite
  # and the reference suite dominate at ~100 s and ~85 s), which is why this
  # is its own job rather than a step in "Test & Build".
  mermaid-rust-tests:
    name: mermaid-little Rust tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: mermaid-little-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: mermaid-little-cargo-

      - name: cargo test -p mermaid-little (lib + integration)
        run: cargo test -p mermaid-little

  # mermaid-little fmt + clippy gate, mirroring `d2-little-full` (the second
  # half of #123's "Suggested shape"). Clippy is non-blocking for now
  # (`continue-on-error`) because the crate has 19 pre-existing warnings
  # (12 × redundant `&` in `format!`, 7 × `?` operator, per #123), so
  # `-D warnings` would fail the step on a clean tree. Once those are
  # cleaned up, drop `continue-on-error` to make clippy gating. rustfmt is
  # gating today — an unformatted PR should not merge.
  mermaid-little-lint:
    name: mermaid-little Rust (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: mermaid-little-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: mermaid-little-cargo-

      - name: rustfmt
        run: cargo fmt -p mermaid-little --check

      - name: clippy (deny warnings, non-blocking — see #123)
        continue-on-error: true
        run: cargo clippy -p mermaid-little --all-targets -- -D warnings

  # plantuml-little byte-exact reference-SVG suite (issue #46, "Full" tier).
  # The committed goldens in tests/reference/ are byte-exact against the wasm
  # Graphviz build (@kookyleo/graphviz-anywhere-web@0.1.8), so the suite runs
  # with PLANTUML_LITTLE_TEST_BACKEND=wasm for cross-platform determinism.
  # scripts/check_reference_failures.sh runs `cargo test --test reference_tests`
  # and requires the failing set to equal tests/known_failures.txt EXACTLY —
  # bidirectional drift detection. This makes the job gating-green today (the
  # ~50 known failures are the open render bugs) while catching every NEW
  # regression or unexpectedly-healed fixture. No Java is needed (unlike the
  # special_ext_reference_* suites, which are out of scope here).
  plantuml-reference:
    name: plantuml-little reference-SVG suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false  # graphviz submodule fetched only on cache miss

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install graphviz build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake bison flex

      - name: Resolve graphviz submodule SHA (cache key)
        id: gvsha
        run: |
          sha=$(git ls-tree HEAD crates/graphviz-anywhere/graphviz | awk '{print $3}')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Restore cached libgraphviz_api
        id: cache
        uses: actions/cache@v4
        with:
          path: crates/graphviz-anywhere/output/linux-x86_64
          key: graphviz-linux-x86_64-${{ steps.gvsha.outputs.sha }}-${{ hashFiles('crates/graphviz-anywhere/scripts/build-linux.sh', 'crates/graphviz-anywhere/scripts/common.sh') }}

      - name: Build libgraphviz_api from submodule (cache miss only)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git submodule update --init --depth 1 crates/graphviz-anywhere/graphviz
          bash crates/graphviz-anywhere/scripts/build-linux.sh

      # The wasm dot backend needs Node 22+ (README) and the published
      # @kookyleo/graphviz-anywhere-web@0.1.8 npm tarball.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache wasm-backend node_modules
        uses: actions/cache@v4
        with:
          path: crates/plantuml-little/tests/support/node_modules
          key: plantuml-wasm-backend-${{ hashFiles('crates/plantuml-little/tests/support/package-lock.json', 'crates/plantuml-little/tests/support/package.json') }}

      - name: Install wasm dot backend
        run: npm install
        working-directory: crates/plantuml-little/tests/support

      # check_reference_failures.sh runs `cargo test --test reference_tests`
      # and diffs the failing set against tests/known_failures.txt. The wasm
      # backend is opted in via the env var; the native libgraphviz_api is
      # statically linked at build time (no LD_LIBRARY_PATH needed).
      - name: Run reference-SVG suite (xfail vs known_failures.txt)
        env:
          PLANTUML_LITTLE_TEST_BACKEND: wasm
        run: bash crates/plantuml-little/scripts/check_reference_failures.sh

  # d2-little: full Rust suite + lint gate. The `d2-rust-tests` job above runs
  # only `--lib`, so the 26 integration tests under crates/d2-little/tests/*.rs
  # (e2e, dagre_cross_validate, font_byte_match, chroma_go_e2e, ...) never run
  # in CI, and the crate's own fmt/clippy gate (crates/d2-little/.github/
  # workflows/ci.yml) is dormant in the monorepo. d2-little is self-contained
  # (no graphviz / fonttools native deps), so a plain toolchain suffices.
  d2-little-full:
    name: d2-little Rust (integration + fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt -p d2-little --check

      - name: clippy (deny warnings)
        run: cargo clippy -p d2-little --all-targets -- -D warnings

      # tests/elk_bridge.rs drives the elkjs bridge end-to-end (prepare →
      # `node tests/elk_runner.mjs` → render) and asserts byte-exact SVG
      # parity with upstream d2 v0.7.1. The runner resolves `elkjs@0.8.2`
      # (the exact version d2 v0.7.1 bundles) from packages/engines, so
      # install it there. Without node+elkjs these tests skip vacuously and
      # the "byte-exact vs upstream d2" claim is unguarded.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install elkjs@0.8.2 for elk bridge tests
        # npm can't parse packages/engines/package.json (bun `workspace:*`
        # protocol), so install elkjs in an isolated dir and symlink it into
        # packages/engines/node_modules — where the elk runner resolves it
        # via Node's upward module walk. The `cd` is wrapped in a subshell so
        # the repo-relative `ln -s` target still resolves from the workspace root.
        run: |
          mkdir -p /tmp/elkjs-install
          (cd /tmp/elkjs-install && npm init -y >/dev/null && npm install elkjs@0.8.2 --no-audit --no-fund)
          mkdir -p packages/engines/node_modules
          ln -s /tmp/elkjs-install/node_modules/elkjs packages/engines/node_modules/elkjs
          node -e 'require("module").createRequire(process.cwd()+"/packages/engines/package.json")("elkjs/lib/elk.bundled.js"); console.log("elkjs resolves OK")'

      - name: cargo test (lib + integration)
        run: cargo test -p d2-little --lib --tests

      # The 293-fixture parity sweep is `#[ignore]` (heavy; ~1 min). Run it
      # explicitly so the `>=190` floor guards against elk-bridge regressions
      # — without this a silent drift in parity would not fail CI.
      - name: elk bridge parity sweep (>=190 floor)
        env:
          D2_ELK_DEBUG: '1'
        run: cargo test -p d2-little --test elk_bridge -- --ignored elk_bridge_fixture_parity --nocapture

  # plantuml-little: the port integration tests (issue #28 frame width, issue
  # #36 create/destroy geometry) live under tests/port_sequence_*.rs and are
  # skipped by the `--lib`-only plantuml-rust-tests job. Reuses the cached
  # graphviz native lib. Do NOT run `--test reference_tests` here — that suite
  # is gated via check_reference_failures.sh (xfail vs known_failures.txt) in
  # the plantuml-reference job; running it bare fails on the ~50 known bugs.
  plantuml-little-integration:
    name: plantuml-little Rust (port integration tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Graphviz build tools
        run: sudo apt-get update && sudo apt-get install -y cmake bison flex pkg-config

      - name: Graphviz submodule revision
        id: gv
        run: echo "sha=$(git rev-parse HEAD:crates/graphviz-anywhere/graphviz)" >> "$GITHUB_OUTPUT"

      - name: Cache Graphviz native lib
        id: gv-cache
        uses: actions/cache@v4
        with:
          path: crates/graphviz-anywhere/output
          key: graphviz-api-linux-x86_64-${{ steps.gv.outputs.sha }}-${{ hashFiles('crates/graphviz-anywhere/scripts/**') }}

      - name: Build Graphviz native lib
        if: steps.gv-cache.outputs.cache-hit != 'true'
        run: (cd crates/graphviz-anywhere && ./scripts/build-linux.sh)

      # Explicit targets so the xfail-gated reference_tests suite is excluded.
      # Extend as new port_* integration files are added.
      - name: cargo test (port integration tests)
        run: >
          cargo test -p plantuml-little
          --test port_sequence_layout
          --test port_sequence_render

[package]
name = "graphviz-anywhere"
version = "0.2.6"
edition = "2021"
# The MSRV is dictated by the mandatory `supramark-diagram-core` dependency
# (1.82), not by this crate's own code.
rust-version = "1.82"
description = "Safe Rust wrapper for the graphviz-anywhere C library with bundled prebuilt binaries (and a wasm32 JS bridge)"
license = "Apache-2.0"
authors = ["kookyleo <kookyleo@gmail.com>"]
repository = "https://github.com/Actrium/supramark"
links = "graphviz_api"
include = [
    "src/",
    "src/build_helpers.rs",
    "tests/",
    "build.rs",
    "Cargo.toml",
    "prebuilt/",
]

[dependencies]
thiserror = "1"
supramark-diagram-core = { path = "../../../supramark-diagram-core", version = "0.1" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

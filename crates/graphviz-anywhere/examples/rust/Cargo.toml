[package]
name = "graphviz-anywhere-example"
version = "0.1.1"
edition = "2021"
# Follows the `graphviz-anywhere` crate's MSRV; the 1.82 floor comes from its
# mandatory `supramark-diagram-core` dependency.
rust-version = "1.82"
license = "Apache-2.0"
authors = ["kookyleo <kookyleo@gmail.com>"]
publish = false

[dependencies]
graphviz-anywhere = { path = "../../packages/rust" }

[[bin]]
name = "graphviz-anywhere-example"
path = "src/main.rs"
test = false
